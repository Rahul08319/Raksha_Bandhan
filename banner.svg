<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180728" />
      <stop offset="35%" stop-color="#3B0B2E" />
      <stop offset="70%" stop-color="#280A38" />
      <stop offset="100%" stop-color="#0F041A" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Festive Silk Gradient -->
    <linearGradient id="silkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#9C27B0" />
    </linearGradient>

    <!-- Flame Radial Glow -->
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#DC2626" />
    </radialGradient>

    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif;
      font-weight: 900;
      letter-spacing: 8px;
      fill: url(#goldGradient);
      filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.4));
    }
    .script-text {
      font-family: 'Brush Script MT', 'Great Vibes', 'Dancing Script', cursive;
      font-size: 32px;
      fill: #FDE047;
      opacity: 0.95;
    }
    .sub-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 3px;
      fill: #E9D5FF;
      opacity: 0.85;
    }
    .badge-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #FEF3C7;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="16" fill="url(#bgGradient)" />

  <!-- Corner Ornamental Borders -->
  <g stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top-Left -->
    <path d="M 24 60 L 24 24 L 60 24" />
    <circle cx="24" cy="24" r="4" fill="#F59E0B" />
    <path d="M 32 32 L 32 48" stroke-dasharray="2 2" />
    <path d="M 32 32 L 48 32" stroke-dasharray="2 2" />

    <!-- Top-Right -->
    <path d="M 1176 60 L 1176 24 L 1140 24" />
    <circle cx="1176" cy="24" r="4" fill="#F59E0B" />
    <path d="M 1168 32 L 1168 48" stroke-dasharray="2 2" />
    <path d="M 1168 32 L 1152 32" stroke-dasharray="2 2" />

    <!-- Bottom-Left -->
    <path d="M 24 380 L 24 416 L 60 416" />
    <circle cx="24" cy="416" r="4" fill="#F59E0B" />

    <!-- Bottom-Right -->
    <path d="M 1176 380 L 1176 416 L 1140 416" />
    <circle cx="1176" cy="416" r="4" fill="#F59E0B" />
  </g>

  <!-- Ambient Mandalas (Left & Right) -->
  <g opacity="0.15" stroke="url(#goldGradient)" fill="none">
    <!-- Left Mandala -->
    <g transform="translate(140, 220)">
      <circle r="140" stroke-width="1.5" stroke-dasharray="6 4" />
      <circle r="110" stroke-width="1" />
      <circle r="80" stroke-width="2" />
      <circle r="50" stroke-width="1" stroke-dasharray="3 3" />
      <circle r="20" stroke-width="1.5" />
      <g stroke-width="1.2">
        <path d="M 0 -140 Q 25 -90 0 -60 Q -25 -90 0 -140" />
        <path d="M 0 140 Q 25 90 0 60 Q -25 90 0 140" />
        <path d="M -140 0 Q -90 25 -60 0 Q -90 -25 -140 0" />
        <path d="M 140 0 Q 90 25 60 0 Q 90 -25 140 0" />
      </g>
    </g>

    <!-- Right Mandala -->
    <g transform="translate(1060, 220)">
      <circle r="140" stroke-width="1.5" stroke-dasharray="6 4" />
      <circle r="110" stroke-width="1" />
      <circle r="80" stroke-width="2" />
      <circle r="50" stroke-width="1" stroke-dasharray="3 3" />
      <circle r="20" stroke-width="1.5" />
      <g stroke-width="1.2">
        <path d="M 0 -140 Q 25 -90 0 -60 Q -25 -90 0 -140" />
        <path d="M 0 140 Q 25 90 0 60 Q -25 90 0 140" />
        <path d="M -140 0 Q -90 25 -60 0 Q -90 -25 -140 0" />
        <path d="M 140 0 Q 90 25 60 0 Q 90 -25 140 0" />
      </g>
    </g>
  </g>

  <!-- Center Halo Aura -->
  <circle cx="600" cy="180" r="180" fill="url(#haloGlow)" />

  <!-- Auspicious Diya Centerpiece -->
  <g transform="translate(600, 75)" filter="url(#softGlow)">
    <!-- Flame -->
    <path d="M 0 -22 C -6 -10 -8 2 0 10 C 8 2 6 -10 0 -22 Z" fill="url(#flameGlow)" />
    <!-- Diya Base -->
    <path d="M -22 10 C -12 24 12 24 22 10 C 14 13 -14 13 -22 10 Z" fill="#92400E" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="-7" cy="15" r="1" fill="#FDE047" />
    <circle cx="0" cy="16" r="1.2" fill="#FDE047" />
    <circle cx="7" cy="15" r="1" fill="#FDE047" />
  </g>

  <!-- Top Badge Pill -->
  <g transform="translate(480, 115)">
    <rect width="240" height="28" rx="14" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1" />
    <text x="120" y="19" text-anchor="middle" class="badge-text">✨ SACRED BOND &amp; FESTIVAL STUDIO</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="190" text-anchor="middle" font-size="52" class="title-text">BANDHAN</text>

  <!-- Script Subtitle -->
  <text x="600" y="235" text-anchor="middle" class="script-text">A Sacred Thread • Eternal Memories</text>

  <!-- Descriptive Subtitle -->
  <text x="600" y="275" text-anchor="middle" class="sub-text">LUXURY FESTIVAL GREETINGS &amp; CARD GENERATOR FOR SIBLINGS</text>

  <!-- Feature Highlights Row -->
  <g transform="translate(230, 315)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
      <text x="80" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FDE047">🎨 6 Luxury Themes</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(190, 0)">
      <rect width="170" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
      <text x="85" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FDE047">🌐 5 Indian Languages</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(390, 0)">
      <rect width="170" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
      <text x="85" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FDE047">⏳ Live Countdown</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(590, 0)">
      <rect width="160" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
      <text x="80" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FDE047">📲 1-Tap WhatsApp</text>
    </g>
  </g>

  <!-- Sparkles & Stars -->
  <g fill="#FDE047" opacity="0.75">
    <path d="M 320 80 L 322 86 L 328 88 L 322 90 L 320 96 L 318 90 L 312 88 L 318 86 Z" />
    <path d="M 880 85 L 882 91 L 888 93 L 882 95 L 880 101 L 878 95 L 872 93 L 878 91 Z" />
    <path d="M 220 280 L 221 284 L 225 285 L 221 286 L 220 290 L 219 286 L 215 285 L 219 284 Z" />
    <path d="M 980 290 L 981 294 L 985 295 L 981 296 L 980 300 L 979 296 L 975 295 L 979 294 Z" />
    <circle cx="450" cy="70" r="1.5" />
    <circle cx="750" cy="65" r="1.5" />
    <circle cx="380" cy="270" r="2" />
    <circle cx="820" cy="280" r="2" />
  </g>

  <!-- Bottom Gold Trim -->
  <rect x="100" y="418" width="1000" height="2" fill="url(#silkGradient)" rx="1" opacity="0.6" />
</svg>
